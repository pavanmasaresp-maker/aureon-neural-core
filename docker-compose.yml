services:
  ollama:
    image: ollama/ollama
    network_mode: host
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build: ./backend
    network_mode: host
    env_file: .env
    environment:
      - OLLAMA_URL=http://127.0.0.1:11434
    depends_on: [ollama]
    restart: unless-stopped

volumes:
  ollama_data:
