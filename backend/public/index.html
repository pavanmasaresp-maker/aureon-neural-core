<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aureon Neural Core</title>
<style>
  :root {
    --mist: #e9eef0; --paper: #ffffff; --ink: #14212b; --muted: #5b6b76;
    --teal: #0b6e6e; --teal-soft: #d5ebea; --line: #cbd6db; --warn: #b5472f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--mist); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    padding: 12px 16px; background: var(--paper); border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  #status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); }
  #dot.on { background: var(--teal); }
  .spacer { flex: 1; }
  select, button, textarea, input {
    font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 8px;
    background: var(--paper);
  }
  select, button { padding: 6px 10px; }
  button { cursor: pointer; }
  button.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 2px solid var(--teal); outline-offset: 2px;
  }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 12px; max-width: 92%; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--ink); color: #fff; }
  .msg.assistant { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); }
  .msg.error { border-color: var(--warn); color: var(--warn); }
  .msg p { margin: 0; white-space: pre-wrap; }
  .msg p + pre, .msg pre + p { margin-top: 8px; }
  pre {
    margin: 0; padding: 10px 12px; overflow-x: auto; border-radius: 8px;
    background: var(--teal-soft); color: #0a2f2f; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
  }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
  .empty strong { color: var(--ink); font-weight: 600; }
  footer { padding: 12px 16px; background: var(--paper); border-top: 1px solid var(--line); }
  .row { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; padding: 10px 12px; resize: none; max-height: 160px; }
  #keyBox { max-width: 420px; margin: 12vh auto 0; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  #keyBox h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  #keyBox p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  #keyBox input { width: 100%; padding: 10px 12px; margin-bottom: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Aureon Neural Core</h1>
  <div id="status"><span id="dot"></span><span id="statusText">Checking Ollama</span></div>
  <div class="spacer"></div>
  <select id="model" aria-label="Model"><option value="auto">Auto (coder or chat)</option></select>
  <button id="clear" type="button">New chat</button>
</header>

<main id="main">
  <section id="keyBox" hidden>
    <h2>Enter your access key</h2>
    <p>Use the NEURAL_CORE_KEY value from your .env file. It is saved only in this browser.</p>
    <input id="keyInput" type="password" autocomplete="off" aria-label="Access key">
    <button id="keySave" class="primary" type="button">Save key</button>
  </section>
  <div class="wrap" id="chat">
    <div class="empty" id="empty">
      <p><strong>Ready to chat, fully local.</strong><br>Ask a coding question or talk in Hinglish. Nothing leaves this machine.</p>
    </div>
  </div>
</main>

<footer>
  <div class="row">
    <textarea id="input" rows="1" placeholder="Message Aureon Neural Core" aria-label="Message"></textarea>
    <button id="send" class="primary" type="button">Send</button>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
let key = localStorage.getItem('ncKey') || '';
let history = [];
let busy = false;
let controller = null;

function showKeyBox(show) {
  $('keyBox').hidden = !show;
  $('chat').hidden = show;
}

async function authFetch(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + key },
  });
  if (res.status === 401) {
    localStorage.removeItem('ncKey');
    key = '';
    showKeyBox(true);
    throw new Error('Wrong or missing access key');
  }
  return res;
}

async function loadModels() {
  try {
    const res = await authFetch('/api/models');
    const data = await res.json();
    const sel = $('model');
    sel.innerHTML = '<option value="auto">Auto (coder or chat)</option>';
    data.models.forEach((m) => {
      const o = document.createElement('option');
      o.value = m; o.textContent = m;
      sel.appendChild(o);
    });
    $('dot').className = data.ollama ? 'on' : '';
    $('statusText').textContent = data.ollama
      ? 'Ollama connected, ' + data.models.length + ' model(s)'
      : 'Ollama not reachable';
    if (data.ollama && data.models.length === 0) {
      $('statusText').textContent = 'Ollama connected, no models yet. Pull one first.';
    }
  } catch (e) {
    $('statusText').textContent = e.message;
  }
}

function renderInto(el, text) {
  el.textContent = '';
  text.split('```').forEach((part, i) => {
    if (i % 2 === 1) {
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.textContent = part.replace(/^[^\n]*\n/, '');
      pre.appendChild(code);
      el.appendChild(pre);
    } else if (part.trim() !== '') {
      const p = document.createElement('p');
      p.textContent = part.trim();
      el.appendChild(p);
    }
  });
}

function addMsg(role, text) {
  $('empty')?.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  renderInto(div, text);
  $('chat').appendChild(div);
  $('main').scrollTop = $('main').scrollHeight;
  return div;
}

function setBusy(on) {
  busy = on;
  $('send').textContent = on ? 'Stop' : 'Send';
}

async function send() {
  if (busy) { controller?.abort(); return; }
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  $('input').style.height = 'auto';
  history.push({ role: 'user', content: text });
  addMsg('user', text);
  const out = addMsg('assistant', '');
  let full = '';
  controller = new AbortController();
  setBusy(true);
  try {
    const res = await authFetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: $('model').value, messages: history, stream: true }),
      signal: controller.signal,
    });
    if (!res.ok) {
      let msg = 'Request failed (' + res.status + ')';
      try { msg = (await res.json()).error || msg; } catch {}
      throw new Error(msg);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const delta = JSON.parse(data).choices?.[0]?.delta?.content;
          if (delta) { full += delta; renderInto(out, full); $('main').scrollTop = $('main').scrollHeight; }
        } catch {}
      }
    }
    history.push({ role: 'assistant', content: full });
  } catch (e) {
    if (e.name === 'AbortError') {
      if (full) history.push({ role: 'assistant', content: full });
    } else {
      out.classList.add('error');
      out.textContent = e.message;
      history.pop();
    }
  } finally {
    setBusy(false);
  }
}

$('send').addEventListener('click', send);
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('input').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px';
});
$('clear').addEventListener('click', () => {
  history = [];
  $('chat').innerHTML = '<div class="empty" id="empty"><p><strong>New chat.</strong><br>Ask anything.</p></div>';
});
$('keySave').addEventListener('click', () => {
  const v = $('keyInput').value.trim();
  if (!v) return;
  key = v;
  localStorage.setItem('ncKey', key);
  $('keyInput').value = '';
  showKeyBox(false);
  loadModels();
});

if (key) { showKeyBox(false); loadModels(); } else { showKeyBox(true); }
</script>
</body>
</html>
